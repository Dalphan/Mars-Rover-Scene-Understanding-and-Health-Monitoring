defaults:
  - model: patchcore
  - _self_

seed: 42
resume: false
resume_run_dir: null

dataset:
  # Required CLI override, for example: dataset.root=D:/datasets/curiosity_wheel_hole_v1_10000
  root: ???
  splits:
    train: train
    validation: validation
    test: test

dataloader:
  batch_size: 4
  num_workers: 2
  pin_memory: true

preprocessing:
  # Input geometry and normalization are owned by the selected model config.
  train:
    resize: ${model.resize}
    resize_shorter_side: ${model.resize_shorter_side}
    center_crop: ${model.center_crop}
    normalize_mean: ${model.image_mean}
    normalize_std: ${model.image_std}
    augmentations_enabled: ${model.train_augmentations_enabled}
    brightness: 0.08
    contrast: 0.08
    gamma: 0.08
    saturation: 0.06
    sensor_noise: 0.004
    gaussian_noise: 0.004
    gaussian_blur: [0.1, 0.5]

  evaluation:
    resize: ${model.resize}
    resize_shorter_side: ${model.resize_shorter_side}
    center_crop: ${model.center_crop}
    normalize_mean: ${model.image_mean}
    normalize_std: ${model.image_std}
    augmentations_enabled: false
    brightness: null
    contrast: null
    gamma: null
    saturation: null
    sensor_noise: null
    gaussian_noise: null
    gaussian_blur: null

# Trainable roadmap models own optimization inside fit; PatchCore remains
# non-parametric. These fields keep the external helper backward compatible.
optimizer:
  name: none

scheduler:
  name: none

evaluation:
  # Ranking metrics do not require selecting an operating threshold.
  metrics: [image_auroc, image_average_precision, pixel_auroc, pixel_average_precision]
  histogram_bins: 2048
  # Enabling this assumes a wheel mask is also available at deployment time.
  restrict_pixels_to_target_mask: false
  diagnostics:
    enabled: true
    group_fields: [severity, camera_pose, lighting, wear]
    num_extreme_examples: 6
    pro_bins: 256
    pro_max_fpr: 0.30
  visualization:
    enabled: true
    num_clean: 3
    num_anomalous: 3
    colormap: magma
    overlay_alpha: 0.55
    dpi: 150

output:
  root: outputs/anomaly_detection
