# @package model
name: efficientad_s
run_name: efficientad_s_384_inframe_posecrop_balanced
input_size: [384, 384]
resize: ${model.input_size}
resize_shorter_side: null
center_crop: null
# EfficientAD performs ImageNet normalization inside teacher, student and AE.
image_mean: null
image_std: null
train_augmentations_enabled: false
pose_crop_enabled: true
train_batch_size: 1
evaluation_batch_size: 8

# Download teacher_small.pth from the pinned nelson1425 source before training.
teacher_weights_path: null
require_teacher_weights: true
channels: 384
# max_steps is a safety ceiling; clean-validation early stopping selects the
# actual duration and restores the best checkpoint.
max_steps: 70000
learning_rate: 0.0001
weight_decay: 0.00001
# official=0.999, balanced=0.995, broad=0.99
hard_quantile_preset: balanced
checkpoint_interval: 5000
validation_interval: 1000
early_stopping_patience: 8
early_stopping_min_steps: 10000
early_stopping_min_relative_improvement: 0.001
lr_scheduler_patience: 3
# Official-style schedule: optimize for all max_steps and reserve validation
# for final global q90/q99.5 calibration only.
fixed_training_duration: true
mixed_precision: true

# Pose-conditioned extension. Calibration images are a deterministic, disjoint
# subset of clean training data; validation selects the image-score aggregation.
spatial_calibration_enabled: false
spatial_calibration_fraction: 0.20
spatial_calibration_min_images: 32
spatial_calibration_q_low: 0.90
spatial_calibration_q_high: 0.995
spatial_calibration_smoothing_sigma: 1.0
spatial_scale_floor_fraction: 0.25
static_roi_min_coverage: 0.50
# 0.0 is spatial max; positive values are fractions of fixed-ROI pixels.
image_score_topk_candidates: [0.0]

# Deterministic partial cache of the official ImageNet-1k train Parquet shards.
penalty_dataset_id: ILSVRC/imagenet-1k
penalty_dataset_revision: 49e2ee26f3810fb5a7536bbf732a7b07389a47b5a
penalty_token_env: HF_TOKEN
penalty_cache_dir: data/cache/imagenet_penalty
penalty_total_shards: 294
penalty_cache_num_shards: 18
penalty_shuffle_buffer_size: 10000
