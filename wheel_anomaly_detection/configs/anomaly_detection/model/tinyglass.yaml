# @package model
name: tinyglass
run_name: tinyglass_full
input_size: [256, 256]
resize: ${model.input_size}
resize_shorter_side: null
center_crop: null
image_mean: [0.485, 0.456, 0.406]
image_std: [0.229, 0.224, 0.225]
train_augmentations_enabled: false
train_batch_size: 8
evaluation_batch_size: 8

pretrained: true
weights_name: IMAGENET1K_V1
patch_size: 3
epochs: 640
learning_rate: 0.0001
weight_decay: 0.01
noise_std: 0.015
radius_quantile: 0.75
hard_mining_quantile: 0.5
gas_steps: 20
gas_step_size: 0.001
hypersphere_projection: true
max_samples_per_epoch: 392
# Local runs must override this with the extracted DTD dtd/images directory.
texture_root: null
require_texture_dataset: true
blend_mean: 0.5
blend_std: 0.1
gaussian_sigma: 4.0
fixed_training_duration: true
validation_interval: 1
validation_batches: 64
