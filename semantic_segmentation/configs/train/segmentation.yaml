# @package _global_

# Python mirror of notebooks/kaggle_segmentation_training.ipynb.
# Synchronization is intentionally one-way: notebook -> modules/config.
defaults:
  - /model: segformer_b0
  - _self_

sync:
  source_notebook: notebooks/kaggle_segmentation_training.ipynb
  direction: notebook_to_python

runtime:
  # Kaggle's notebook guard is retained as metadata. Enable the check when an
  # exact reproduction environment is required.
  expected_torch_version: "2.9.1"
  enforce_torch_version: false
  device: auto
  data_parallel_max_gpus: 2
  torch_multiprocessing_sharing_strategy: file_system

seed: 42
dataset_name: s5mars  # s5mars | marsseg_msl | marsseg_mer
run_cross_dataset_evaluation: false

datasets:
  s5mars:
    family: s5mars
    repo_id: Mirali33/mb-s5mars
    display_name: S5Mars
    num_classes: 9
    expected_split_sizes: {}
    cross_dataset_name: null
    class_names:
      0: Background
      1: Bedrock
      2: Hole
      3: Ridge
      4: Rock
      5: Rover
      6: Sand / Soil
      7: Sky
      8: Track
  marsseg_msl:
    family: marsseg
    repo_id: Mirali33/mb-mars_seg_msl
    display_name: MarsSeg MSL
    num_classes: 7
    expected_split_sizes: {train: 2893, val: 413, test: 828}
    cross_dataset_name: marsseg_mer
    class_names:
      0: Background
      1: Bedrock
      2: Gravel / Sand / Soil
      3: Rock
      4: Shadow
      5: Sky / Distant Mountains
      6: Track
  marsseg_mer:
    family: marsseg
    repo_id: Mirali33/mb-mars_seg_mer
    display_name: MarsSeg MER
    num_classes: 7
    expected_split_sizes: {train: 744, val: 106, test: 214}
    cross_dataset_name: marsseg_msl
    class_names:
      0: Background
      1: Bedrock
      2: Gravel / Sand / Soil
      3: Rock
      4: Shadow
      5: Sky / Distant Mountains
      6: Track

huggingface:
  token: HF_TOKEN_PLACEHOLDER
  token_env: HF_TOKEN
  use_auth_token: true
  cache_dir: null

splits: {train: train, val: val, test: test}
dataset_columns:
  image: image
  mask: mask
  width: width
  height: height
  class_labels: class_labels

image_size: [512, 512]
image_mean: [0.485, 0.456, 0.406]
image_std: [0.229, 0.224, 0.225]
# Outside every configured mask range: Background remains a real class.
ignore_index: -100

epochs: 30
batch_size: 32
freeze: none  # none | encoder | classifier

dataloader:
  train_num_workers: 4
  eval_num_workers: 0
  pin_memory: false
  prefetch_factor: 1
  persistent_workers: false

augmentation:
  enabled: false
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.5
  random_rotate90_prob: 0.5

oversampling:
  enabled: false
  power: 0.5
  max_weight: 3.0
  num_samples_multiplier: 1.0
  replacement: true
  excluded_class_ids: []

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_epochs: 1

criterion:
  name: combined  # cross_entropy | generalized_dice | combined
  alpha: 0.5
  weight_type: square  # uniform | simple | square
  smooth: 1.0e-5

model_analysis:
  enabled: false
  warmup_iterations: 50
  measurement_iterations: 100

limits:
  train_batches: null
  val_batches: null
  test_batches: null

memory:
  log_usage: true
  log_interval_batches: 100

execution:
  # skip_train is evaluation-only and therefore requires load_checkpoint.
  skip_train: false
  load_checkpoint: true
  load_best: true

checkpoint:
  save_best: true
  output_root: outputs
  output_dir: null
  download_from_drive: false
  force_download: false
  drive_folder_id_override: null
  drive_folder_ids:
    segformer_b0_standard_sampling_square_no_aug_s5mars: 1gor4_Lct_xBMJuWlfxnAXm0fYNjcKBRs
    smp_unet_mobilenet_v2_standard_sampling_square_no_aug_s5mars: 1Ub1bDNDwNMTm5NSLnyIC6DVm5IRcLCmE
    smp_unet_resnet34_standard_sampling_square_no_aug_s5mars: 1IJQfHvlQs_g8-uhVWHqWQD0WjkjP6jXg
    smp_deeplabv3plus_mobilenet_v2_standard_sampling_square_no_aug_s5mars: 15gfIfMeV9Y_KjGjNzA7wizgT4W1GV60o
    smp_deeplabv3_resnet34_standard_sampling_square_no_aug_s5mars: 113m70R3G5WLJMTLwuUHAOlHT5eLe7lpX
    segformer_b0_standard_sampling_square_no_aug_marsseg_msl: 1W-zTWGZuG8p3XGFoiBNUXHtdQY01MsGE
    smp_unet_resnet34_standard_sampling_square_no_aug_marsseg_msl: 1XTQhSuD33a5dixLXo1tawTsDej1Qbnkf

predictions:
  enabled: true
  num_samples: 3
  alpha: 0.45

logging:
  level: INFO
  log_to_file: true
  filename: train.log

hydra:
  run:
    dir: .
  output_subdir: null
