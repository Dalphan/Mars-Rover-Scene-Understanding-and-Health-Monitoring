# @package model

# Generic segmentation_models_pytorch config.
# Supported project presets:
#   - U-Net ResNet34:       model=smp
#   - U-Net MobileNetV2:    model=smp model.encoder_name=mobilenet_v2
#   - DeepLabV3 ResNet34:   model=smp model.architecture=deeplabv3
#   - DeepLabV3+ MobileNetV2:
#       model=smp model.architecture=deeplabv3plus model.encoder_name=mobilenet_v2
name: "smp"
run_name: "smp_${model.architecture}_${model.encoder_name}"

# Supported architecture choices: [unet, deeplabv3, deeplabv3plus].
architecture: "unet"

# Tested encoder choices in this project: [resnet34, mobilenet_v2].
# Other segmentation_models_pytorch encoders may work if installed/supported.
encoder_name: "resnet34"

# Common choices: imagenet, null.
encoder_weights: "imagenet"

in_channels: 3

# Mars-Bench / S5Mars masks are already encoded as 0..8.
num_classes: 9

# Used by cross-entropy and metrics. Generalized Dice includes class 0.
ignore_index: -100

# Required input resolution for the current training pipeline.
input_size: [512, 512]

# ImageNet normalization for pretrained encoders.
image_mean: [0.485, 0.456, 0.406]
image_std: [0.229, 0.224, 0.225]

# Enable optional debug logging for tensor shapes.
log_shapes: true
