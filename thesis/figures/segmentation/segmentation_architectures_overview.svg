<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Overview of the semantic-segmentation architecture families</title>
  <desc id="desc">Four-panel schematic comparing the U-Net, DeepLab, SegFormer-B0, and LCNet implementations used in the Martian scene-understanding study.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .panel-title { font: 700 24px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #475569; }
      .label { font: 600 16px Arial, Helvetica, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 14px Arial, Helvetica, sans-serif; fill: #334155; text-anchor: middle; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #475569; text-anchor: middle; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .input { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .encoder { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .context { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .decoder { fill: #ffedd5; stroke: #ea580c; stroke-width: 2; }
      .light { fill: #d1fae5; stroke: #059669; stroke-width: 2; }
      .output { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .skip { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrowBlue); }
      .guide { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="800" y="48" class="title" text-anchor="middle">Semantic-segmentation architectures used in this study</text>
  <text x="800" y="75" class="subtitle" text-anchor="middle">All configurations map a 512 × 512 RGB image to nine full-resolution class-logit maps</text>

  <!-- U-Net panel -->
  <rect x="35" y="100" width="750" height="400" rx="18" class="panel"/>
  <text x="65" y="140" class="panel-title">A. U-Net variants</text>
  <text x="65" y="166" class="subtitle">ResNet-34 or MobileNetV2 encoder; five-stage skip-connected decoder</text>

  <rect x="70" y="252" width="78" height="66" rx="10" class="input"/>
  <text x="109" y="280" class="label">RGB</text>
  <text x="109" y="302" class="small">512²</text>

  <rect x="188" y="220" width="92" height="130" rx="10" class="encoder"/>
  <rect x="204" y="236" width="60" height="24" rx="5" fill="#93c5fd"/>
  <rect x="211" y="270" width="46" height="24" rx="5" fill="#60a5fa"/>
  <rect x="218" y="304" width="32" height="24" rx="5" fill="#3b82f6"/>
  <text x="234" y="376" class="label">Encoder</text>
  <text x="234" y="396" class="tiny">multiscale features</text>

  <rect x="338" y="258" width="104" height="54" rx="10" class="context"/>
  <text x="390" y="281" class="label">Deepest</text>
  <text x="390" y="301" class="small">representation</text>

  <rect x="500" y="220" width="102" height="130" rx="10" class="decoder"/>
  <rect x="517" y="304" width="68" height="24" rx="5" fill="#fdba74"/>
  <rect x="510" y="270" width="82" height="24" rx="5" fill="#fb923c"/>
  <rect x="503" y="236" width="96" height="24" rx="5" fill="#f97316"/>
  <text x="551" y="376" class="label">Decoder</text>
  <text x="551" y="396" class="tiny">256–128–64–32–16</text>

  <rect x="662" y="252" width="88" height="66" rx="10" class="output"/>
  <text x="706" y="279" class="label">Logits</text>
  <text x="706" y="301" class="small">9 × 512²</text>

  <path d="M148 285 H185" class="arrow"/>
  <path d="M280 285 H335" class="arrow"/>
  <path d="M442 285 H497" class="arrow"/>
  <path d="M602 285 H659" class="arrow"/>
  <path d="M245 235 C330 185, 445 185, 535 235" class="skip"/>
  <path d="M250 282 C340 220, 445 220, 525 282" class="skip"/>
  <path d="M250 322 C345 265, 445 265, 517 322" class="skip"/>
  <text x="392" y="194" class="small">concatenated skip connections</text>
  <text x="390" y="456" class="small">ResNet-34: residual blocks and higher capacity</text>
  <text x="390" y="478" class="small">MobileNetV2: inverted residuals, depthwise convolutions, linear bottlenecks</text>

  <!-- DeepLab panel -->
  <rect x="815" y="100" width="750" height="400" rx="18" class="panel"/>
  <text x="845" y="140" class="panel-title">B. DeepLab variants</text>
  <text x="845" y="166" class="subtitle">Atrous spatial pyramid pooling (ASPP) with two decoder choices</text>

  <rect x="848" y="250" width="76" height="66" rx="10" class="input"/>
  <text x="886" y="278" class="label">RGB</text>
  <text x="886" y="300" class="small">512²</text>

  <rect x="966" y="232" width="120" height="102" rx="10" class="encoder"/>
  <text x="1026" y="266" class="label">Encoder</text>
  <text x="1026" y="289" class="small">ResNet-34</text>
  <text x="1026" y="311" class="small">or MobileNetV2</text>

  <rect x="1134" y="210" width="154" height="146" rx="10" class="context"/>
  <text x="1211" y="237" class="label">ASPP</text>
  <rect x="1150" y="251" width="46" height="34" rx="5" fill="#c4b5fd"/>
  <rect x="1202" y="251" width="30" height="34" rx="5" fill="#a78bfa"/>
  <rect x="1238" y="251" width="30" height="34" rx="5" fill="#8b5cf6"/>
  <rect x="1150" y="296" width="54" height="34" rx="5" fill="#7c3aed"/>
  <rect x="1210" y="296" width="58" height="34" rx="5" fill="#ddd6fe"/>
  <text x="1173" y="273" class="tiny">1×1</text>
  <text x="1217" y="273" class="tiny">r12</text>
  <text x="1253" y="273" class="tiny">r24</text>
  <text x="1177" y="318" class="tiny" fill="#ffffff">r36</text>
  <text x="1239" y="318" class="tiny">pool</text>

  <rect x="1334" y="195" width="188" height="76" rx="10" class="decoder"/>
  <text x="1428" y="224" class="label">DeepLabV3</text>
  <text x="1428" y="247" class="small">ASPP + classifier, OS 8</text>

  <rect x="1334" y="302" width="188" height="82" rx="10" class="decoder"/>
  <text x="1428" y="329" class="label">DeepLabV3+</text>
  <text x="1428" y="351" class="small">low-level fusion, OS 16</text>
  <text x="1428" y="371" class="tiny">depthwise-separable decoder</text>

  <path d="M924 283 H963" class="arrow"/>
  <path d="M1086 283 H1131" class="arrow"/>
  <path d="M1288 260 C1308 255, 1315 235, 1331 233" class="arrow"/>
  <path d="M1288 306 C1308 312, 1315 338, 1331 343" class="arrow"/>
  <path d="M1086 307 C1190 414, 1260 414, 1331 359" class="skip"/>
  <text x="1205" y="433" class="small">low-resolution context</text>
  <text x="1205" y="456" class="small">+ optional shallow-detail recovery</text>

  <!-- SegFormer panel -->
  <rect x="35" y="525" width="750" height="405" rx="18" class="panel"/>
  <text x="65" y="565" class="panel-title">C. SegFormer-B0</text>
  <text x="65" y="591" class="subtitle">Hierarchical Mix Transformer encoder and lightweight all-MLP decoder</text>

  <rect x="68" y="680" width="70" height="62" rx="10" class="input"/>
  <text x="103" y="706" class="label">RGB</text>
  <text x="103" y="727" class="small">512²</text>

  <rect x="174" y="648" width="94" height="126" rx="10" class="encoder"/>
  <text x="221" y="676" class="label">Stage 1</text>
  <text x="221" y="701" class="small">32 @ 1/4</text>
  <text x="221" y="724" class="tiny">2 blocks</text>
  <text x="221" y="746" class="tiny">SR = 8</text>

  <rect x="290" y="657" width="94" height="108" rx="10" class="encoder"/>
  <text x="337" y="685" class="label">Stage 2</text>
  <text x="337" y="710" class="small">64 @ 1/8</text>
  <text x="337" y="733" class="tiny">2 blocks; SR = 4</text>

  <rect x="406" y="666" width="94" height="90" rx="10" class="encoder"/>
  <text x="453" y="694" class="label">Stage 3</text>
  <text x="453" y="719" class="small">160 @ 1/16</text>
  <text x="453" y="742" class="tiny">2 blocks; SR = 2</text>

  <rect x="522" y="675" width="94" height="72" rx="10" class="encoder"/>
  <text x="569" y="702" class="label">Stage 4</text>
  <text x="569" y="727" class="small">256 @ 1/32</text>

  <rect x="184" y="812" width="432" height="52" rx="10" class="context"/>
  <text x="400" y="835" class="label">Per-stage linear projection to 256 channels</text>
  <text x="400" y="855" class="small">upsample to 1/4 → concatenate → 1×1 fusion</text>

  <rect x="656" y="680" width="94" height="62" rx="10" class="output"/>
  <text x="703" y="705" class="label">Logits</text>
  <text x="703" y="726" class="small">9 @ 1/4</text>

  <path d="M138 711 H171" class="arrow"/>
  <path d="M268 711 H287" class="arrow"/>
  <path d="M384 711 H403" class="arrow"/>
  <path d="M500 711 H519" class="arrow"/>
  <path d="M616 711 H653" class="arrow"/>
  <path d="M221 774 V809" class="guide"/>
  <path d="M337 765 V809" class="guide"/>
  <path d="M453 756 V809" class="guide"/>
  <path d="M569 747 V809" class="guide"/>
  <path d="M616 838 C650 838, 668 780, 692 745" class="arrow"/>
  <text x="703" y="782" class="small">bilinear ×4</text>
  <text x="703" y="803" class="tiny">to 512²</text>
  <text x="400" y="899" class="small">Overlapping patch embeddings; efficient self-attention; no explicit positional encoding</text>

  <!-- LCNet panel -->
  <rect x="815" y="525" width="750" height="405" rx="18" class="panel"/>
  <text x="845" y="565" class="panel-title">D. LCNet variants</text>
  <text x="845" y="591" class="subtitle">Project-compatible reimplementation; 50% partial-channel transformation</text>

  <rect x="842" y="674" width="66" height="62" rx="10" class="input"/>
  <text x="875" y="700" class="label">RGB</text>
  <text x="875" y="721" class="small">512²</text>

  <rect x="944" y="662" width="92" height="86" rx="10" class="light"/>
  <text x="990" y="690" class="label">Stem</text>
  <text x="990" y="713" class="small">3 conv.</text>
  <text x="990" y="734" class="tiny">32 @ 1/2</text>

  <rect x="1072" y="650" width="124" height="110" rx="10" class="light"/>
  <text x="1134" y="678" class="label">Stage 1</text>
  <text x="1134" y="702" class="small">downsample</text>
  <text x="1134" y="725" class="small">+ 3 PCT</text>
  <text x="1134" y="747" class="tiny">64 @ 1/4 (shallow)</text>

  <rect x="1232" y="642" width="132" height="126" rx="10" class="light"/>
  <text x="1298" y="670" class="label">Stage 2</text>
  <text x="1298" y="694" class="small">downsample</text>
  <text x="1298" y="717" class="small">+ 7 / 11 PCT</text>
  <text x="1298" y="740" class="tiny">128 @ 1/8 (deep)</text>

  <rect x="1400" y="653" width="126" height="104" rx="10" class="decoder"/>
  <text x="1463" y="680" class="label">Dual-attention</text>
  <text x="1463" y="702" class="label">decoder</text>
  <text x="1463" y="728" class="tiny">9 logits @ 1/4</text>
  <text x="1463" y="747" class="tiny">bilinear to 512²</text>

  <path d="M908 705 H941" class="arrow"/>
  <path d="M1036 705 H1069" class="arrow"/>
  <path d="M1196 705 H1229" class="arrow"/>
  <path d="M1364 705 H1397" class="arrow"/>
  <path d="M1134 650 C1195 610, 1370 610, 1430 650" class="skip"/>
  <text x="1285" y="618" class="small">shallow spatial guidance</text>

  <rect x="954" y="812" width="474" height="72" rx="12" class="context"/>
  <text x="1191" y="836" class="label">PCT block</text>
  <text x="1191" y="859" class="small">split channels: 50% identity | 50% three-branch context aggregation</text>
  <text x="1191" y="878" class="tiny">local depthwise + dilated depthwise context → concatenate → 1×1 fusion</text>
  <path d="M1134 760 C1134 786, 1150 795, 1172 809" class="guide"/>
  <path d="M1298 768 C1298 789, 1265 799, 1245 809" class="guide"/>

  <!-- Legend -->
  <rect x="266" y="951" width="22" height="16" rx="3" class="encoder"/>
  <text x="299" y="965" class="subtitle">feature encoder</text>
  <rect x="505" y="951" width="22" height="16" rx="3" class="context"/>
  <text x="538" y="965" class="subtitle">context aggregation</text>
  <rect x="782" y="951" width="22" height="16" rx="3" class="decoder"/>
  <text x="815" y="965" class="subtitle">decoder / fusion</text>
  <rect x="1027" y="951" width="22" height="16" rx="3" class="light"/>
  <text x="1060" y="965" class="subtitle">lightweight LCNet block</text>
  <path d="M1306 959 H1350" class="skip"/>
  <text x="1360" y="965" class="subtitle">skip / guidance</text>
</svg>
