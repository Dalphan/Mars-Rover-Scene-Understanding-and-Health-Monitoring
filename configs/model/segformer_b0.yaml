# @package model

name: segformer_b0

pretrained_name: nvidia/segformer-b0-finetuned-ade-512-512

# Mars-Bench / S5Mars:
# labels are already encoded as 0..8.
# class 0 is ignored during loss and metrics.
num_classes: 9
ignore_index: 0

# Required input resolution.
input_size: [512, 512]

# Use ImageNet normalization for the pretrained SegFormer backbone.
image_mean: [0.485, 0.456, 0.406]
image_std: [0.229, 0.224, 0.225]

# Enable optional debug logging for tensor shapes.
log_shapes: true
